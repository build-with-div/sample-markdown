[package]
name = "markdown-render"
description = "Renders the Markdown fidelity fixtures with Div's public API"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "markdown-render"
path = "src/main.rs"

[dependencies]
divui.workspace = true
# Attributes keep their document order from the capture.
serde_json = { workspace = true, features = ["preserve_order"] }
markdown-tree = { path = "../../crates/markdown-tree" }
markdown-highlight = { path = "../../crates/markdown-highlight" }
markdown-div = { path = "../../crates/markdown-div" }
