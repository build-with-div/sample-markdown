[package]
name = "markdown-highlight"
description = "Shiki's code highlighting: vscode-textmate's tokenizer on Oniguruma, with Shiki's grammars and themes"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The element tree `codeToHast` builds, and the hook rehype runs it from.
markdown-tree = { path = "../markdown-tree" }
# Oniguruma, the regex engine vscode-oniguruma compiles to WebAssembly for
# Shiki. Without `generate`, onig_sys uses its pregenerated bindings and
# needs no libclang.
onig = { version = "6.5.1", default-features = false }
# `preserve_order`: grammars and themes are read in JavaScript's key order.
serde_json = { workspace = true, features = ["preserve_order"] }
