[workspace]
resolver = "2"
members = ["crates/markdown-tree", "harness/render"]

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

# Div is pinned to one commit. Bump `rev` here and in the patch table below
# together, deliberately, when a framework change this sample needs lands.
[workspace.dependencies]
# div-gap: G-PKG. Cargo.lock is seeded from Div's own lock (see sample-git
# gap 24: a fresh resolve picks a zbus_macros that does not build on Linux).
divui = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }
serde_json = "1.0"
comrak = { version = "=0.59.0", default-features = false }
html5ever = "=0.40.1"
markup5ever_rcdom = "=0.40.1"

# The framework's dependency patches, which Cargo does not apply to
# dependents. Keep them equal to the pinned Div workspace's.
[patch.crates-io]
skia-safe = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skia-bindings = { git = "https://github.com/rust-skia/rust-skia.git", rev = "a31b86ba3b767344d39af3b8c30043003d8fc991" }
skrifa = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }
read-fonts = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }
font-types = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }
bytemuck = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }
bytemuck_derive = { git = "https://github.com/build-with-div/div", rev = "92ea25a0756dd3e22aa57266ae5ead49a1ff9d8f" }

[profile.dev.package."*"]
opt-level = 2

# On Linux, rust-skia compiles Skia at this package's opt-level, which is
# part of the rendering configuration. Keep it equal in every profile.
[profile.dev.package.skia-bindings]
opt-level = 3

[profile.release.package.skia-bindings]
opt-level = 3
