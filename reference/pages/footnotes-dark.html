<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>footnotes (dark)</title>
<link rel="stylesheet" href="css/github-markdown-dark.css">
<link rel="stylesheet" href="css/page.css">
</head>
<body>
<article class="markdown-body">
<p>A sentence with a footnote.<sup><a href="#user-content-fn-1" id="user-content-fnref-1" data-footnote-ref="" aria-describedby="footnote-label">1</a></sup> And another one.<sup><a href="#user-content-fn-note" id="user-content-fnref-note" data-footnote-ref="" aria-describedby="footnote-label">2</a></sup></p>
<section data-footnotes="" class="footnotes"><h2 class="sr-only" id="footnote-label">Footnotes</h2>
<ol>
<li id="user-content-fn-1">
<p>The first footnote. <a href="#user-content-fnref-1" data-footnote-backref="" aria-label="Back to reference 1" class="data-footnote-backref">↩</a></p>
</li>
<li id="user-content-fn-note">
<p>A named footnote with <code>code</code>. <a href="#user-content-fnref-note" data-footnote-backref="" aria-label="Back to reference 2" class="data-footnote-backref">↩</a></p>
</li>
</ol>
</section>
</article>
</body>
</html>
